<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Blog Post - Genius Computer Education</title>
    <meta id="metaDescription" name="description" content="Read the full article on Genius Computer Education blog.">
    <meta id="ogTitle" property="og:title" content="Blog Post">
    <meta id="ogDescription" property="og:description" content="">
    <meta id="ogImage" property="og:image" content="">
    <meta property="og:type" content="article">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reading progress bar */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            width: 0%;
            z-index: 9999;
            transition: width 0.1s linear;
        }
        .post-wrapper {
            max-width: 1200px;
            margin: 100px auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 40px;
        }
        @media (max-width: 992px) {
            .post-wrapper { grid-template-columns: 1fr; }
        }
        .post-main {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 40px;
            color: #fff;
        }
        .breadcrumb {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }
        .breadcrumb a { color: rgba(255,255,255,0.8); text-decoration: none; }
        .breadcrumb a:hover { color: #fff; text-decoration: underline; }
        .post-category-pill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 14px;
        }
        .post-title {
            font-size: 36px;
            line-height: 1.3;
            margin: 0 0 20px;
            color: #fff;
            font-weight: 700;
        }
        .post-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .post-meta span i { margin-right: 6px; opacity: 0.8; }
        .post-image {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .post-body {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(255,255,255,0.92);
        }
        .post-body p { margin-bottom: 16px; }
        .post-body h2, .post-body h3 { color: #fff; margin: 28px 0 14px; }
        .post-body img { max-width: 100%; border-radius: 8px; margin: 16px 0; height: auto; }
        .post-body img.img-align-left { float: left; margin: 4px 20px 10px 0; max-width: 50%; }
        .post-body img.img-align-right { float: right; margin: 4px 0 10px 20px; max-width: 50%; }
        .post-body img.img-align-center { display: block; margin: 16px auto; }
        .post-body .blog-caption {
            text-align: center;
            font-style: italic;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin: -8px 0 20px;
            padding: 0 12px;
        }
        .post-body p:has(> img) { clear: both; }
        .post-body::after { content: ''; display: table; clear: both; }
        .post-body a { color: #fbbf24; text-decoration: underline; }
        .post-body ul, .post-body ol { padding-left: 24px; margin: 12px 0; }
        .post-body li { margin-bottom: 6px; }
        @media (max-width: 600px) {
            .post-body img.img-align-left,
            .post-body img.img-align-right { float: none; display: block; margin: 16px auto; max-width: 100%; }
        }
        .post-body blockquote {
            border-left: 4px solid #f59e0b;
            padding: 12px 18px;
            margin: 18px 0;
            background: rgba(245,158,11,0.1);
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }
        .post-body code {
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .share-section {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }
        .share-section h4 { margin-bottom: 12px; color: #fff; }
        .share-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .share-btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .share-btn:hover { transform: translateY(-2px); }
        .share-whatsapp { background: #25d366; }
        .share-facebook { background: #1877f2; }
        .share-linkedin { background: #0a66c2; }
        .share-twitter { background: #1da1f2; }
        .share-copy { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }
        /* Sidebar */
        .post-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 22px;
            color: #fff;
        }
        .sidebar-card h4 {
            font-size: 15px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar-cat-list { display: flex; flex-direction: column; gap: 6px; }
        .sidebar-cat-link {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s;
        }
        .sidebar-cat-link:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .sidebar-cat-link span:last-child {
            background: rgba(255,255,255,0.15);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        .sidebar-post {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }
        .sidebar-post:last-child { border-bottom: none; }
        .sidebar-post:hover { background: rgba(255,255,255,0.04); }
        .sidebar-post-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .sidebar-post-info { flex: 1; min-width: 0; }
        .sidebar-post-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .sidebar-post-meta { font-size: 11px; color: rgba(255,255,255,0.6); }
        .post-loading, .post-not-found { text-align: center; padding: 100px 20px; color: rgba(255,255,255,0.7); }
        .post-not-found i { font-size: 60px; opacity: 0.4; margin-bottom: 16px; }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .related-section {
            margin-top: 50px;
        }
        .related-section h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="reading-progress" id="readingProgress"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23667eea%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22%3EG%3C/text%3E%3C/svg%3E" alt="Logo" class="nav-logo" style="display:block;max-height:45px;max-width:45px;border-radius:10px;">
                <a href="index.html">Genius Computer Education</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#courses">Courses</a></li>
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="student-portal.html" class="nav-cta nav-student"><i class="fas fa-user-graduate"></i> Student Portal</a></li>
            </ul>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <div class="post-wrapper">
        <!-- Main Content -->
        <article class="post-main">
            <div id="postContent">
                <div class="post-loading">
                    <i class="fas fa-spinner fa-spin" style="font-size:40px;color:#f59e0b;"></i>
                    <p style="margin-top:14px;">Loading article...</p>
                </div>
            </div>
        </article>

        <!-- Sidebar -->
        <aside class="post-sidebar">
            <div class="sidebar-card">
                <h4><i class="fas fa-folder"></i> Categories</h4>
                <div class="sidebar-cat-list" id="sidebarCategories"></div>
            </div>
            <div class="sidebar-card">
                <h4><i class="fas fa-thumbtack"></i> Featured Posts</h4>
                <div id="sidebarPinned"></div>
            </div>
            <div class="sidebar-card">
                <h4><i class="fas fa-history"></i> Recent Posts</h4>
                <div id="sidebarRecent"></div>
            </div>
        </aside>
    </div>

    <!-- Related Posts -->
    <section class="container">
        <div class="related-section" id="relatedSection" style="display:none;">
            <h2><i class="fas fa-newspaper" style="color:#f59e0b;"></i> Related Articles</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Genius Computer Education. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        let _currentBlog = null;
        let _allBlogs = [];

        function getBlogId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadPost() {
            const id = getBlogId();
            if (!id) {
                showNotFound();
                return;
            }
            try {
                const res = await fetch('/api/blogs');
                const data = await res.json();
                if (!data.success || !data.blogs) {
                    showNotFound();
                    return;
                }
                _allBlogs = data.blogs.filter(b => b.published);
                _currentBlog = _allBlogs.find(b => b.id == id);
                if (!_currentBlog) {
                    showNotFound();
                    return;
                }
                renderPost();
                renderSidebar();
                renderRelated();
                trackView(id);
            } catch (e) {
                console.error('Error:', e);
                showNotFound();
            }
        }

        function showNotFound() {
            document.getElementById('postContent').innerHTML = `
                <div class="post-not-found">
                    <i class="far fa-frown"></i>
                    <h2 style="color:#fff;">Article not found</h2>
                    <p>The blog post you are looking for does not exist or has been removed.</p>
                    <a href="blog.html" class="btn btn-primary" style="margin-top:20px;display:inline-block;padding:12px 24px;text-decoration:none;border-radius:8px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;">
                        <i class="fas fa-arrow-left"></i> Back to Blog
                    </a>
                </div>`;
        }

        function renderPost() {
            const b = _currentBlog;
            // Update head meta
            document.getElementById('pageTitle').textContent = b.title + ' - Genius Computer Education';
            const excerpt = String(b.content || '').replace(/<[^>]+>/g, ' ').trim().substring(0, 160);
            document.getElementById('metaDescription').setAttribute('content', excerpt);
            document.getElementById('ogTitle').setAttribute('content', b.title);
            document.getElementById('ogDescription').setAttribute('content', excerpt);
            if (b.image) document.getElementById('ogImage').setAttribute('content', b.image);

            const date = new Date(b.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            const imgHtml = b.image ? `<img src="${b.image}" alt="${b.title}" class="post-image">` : '';
            const html = `
                <div class="breadcrumb">
                    <a href="index.html">Home</a> &rsaquo; <a href="blog.html">Blog</a> &rsaquo; <a href="blog.html" onclick="event.preventDefault();window.location.href='blog.html';">${b.category}</a> &rsaquo; <span>${b.title}</span>
                </div>
                <span class="post-category-pill"><i class="fas fa-folder-open"></i> ${b.category}</span>
                <h1 class="post-title">${b.title}</h1>
                <div class="post-meta">
                    <span><i class="fas fa-user"></i> ${b.author || 'Admin'}</span>
                    <span><i class="far fa-calendar"></i> ${date}</span>
                    <span><i class="far fa-clock"></i> ${b.readingTime || 1} min read</span>
                    <span><i class="far fa-eye"></i> ${(b.views || 0) + 1} views</span>
                </div>
                ${imgHtml}
                <div class="post-body">${b.content}</div>
                <div class="share-section">
                    <h4><i class="fas fa-share-alt"></i> Share this article</h4>
                    <div class="share-buttons">
                        <a href="https://wa.me/?text=${encodeURIComponent(b.title + ' - ' + window.location.href)}" target="_blank" class="share-btn share-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn share-facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
                        <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(b.title)}&url=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn share-twitter"><i class="fab fa-twitter"></i> Twitter</a>
                        <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn share-linkedin"><i class="fab fa-linkedin-in"></i> LinkedIn</a>
                        <button class="share-btn share-copy" onclick="copyLink()"><i class="fas fa-link"></i> <span id="copyText">Copy Link</span></button>
                    </div>
                </div>`;
            document.getElementById('postContent').innerHTML = html;
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const el = document.getElementById('copyText');
                const orig = el.textContent;
                el.textContent = 'Copied!';
                setTimeout(() => el.textContent = orig, 2000);
            });
        }

        function renderSidebar() {
            // Categories with counts
            const counts = {};
            _allBlogs.forEach(b => {
                const c = b.category || 'General';
                counts[c] = (counts[c] || 0) + 1;
            });
            const catContainer = document.getElementById('sidebarCategories');
            catContainer.innerHTML = Object.keys(counts).sort().map(c => `
                <a class="sidebar-cat-link" href="blog.html"><span>${c}</span><span>${counts[c]}</span></a>
            `).join('');

            // Pinned
            const pinned = _allBlogs.filter(b => b.pinned && b.id != _currentBlog.id).slice(0, 4);
            const pinnedContainer = document.getElementById('sidebarPinned');
            if (pinned.length === 0) {
                pinnedContainer.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:12px;">No featured posts yet.</p>';
            } else {
                pinnedContainer.innerHTML = pinned.map(b => renderSidebarPost(b)).join('');
            }

            // Recent
            const recent = _allBlogs
                .filter(b => b.id != _currentBlog.id)
                .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                .slice(0, 5);
            document.getElementById('sidebarRecent').innerHTML = recent.map(b => renderSidebarPost(b)).join('');
        }

        function renderSidebarPost(b) {
            const date = new Date(b.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
            const thumbStyle = b.image ? `background-image:url('${b.image}');` : '';
            return `
                <a class="sidebar-post" href="blog-post.html?id=${b.id}">
                    <div class="sidebar-post-thumb" style="${thumbStyle}"></div>
                    <div class="sidebar-post-info">
                        <div class="sidebar-post-title">${b.title}</div>
                        <div class="sidebar-post-meta">${date} &bull; ${b.readingTime || 1} min</div>
                    </div>
                </a>`;
        }

        function renderRelated() {
            const related = _allBlogs
                .filter(b => b.id != _currentBlog.id && b.category === _currentBlog.category)
                .slice(0, 3);
            if (related.length === 0) return;
            document.getElementById('relatedSection').style.display = 'block';
            document.getElementById('relatedGrid').innerHTML = related.map(blog => {
                const excerpt = String(blog.content || '').replace(/<[^>]+>/g, ' ').trim();
                const shortDesc = excerpt.substring(0, 100) + (excerpt.length > 100 ? '...' : '');
                const imgHtml = blog.image ? `<div class="blog-card-image" style="background-image:url('${blog.image}');"></div>` : '';
                return `
                <div class="blog-card" onclick="window.location.href='blog-post.html?id=${blog.id}'">
                    ${imgHtml}
                    <div class="blog-card-body">
                        <div class="blog-header">
                            <span class="blog-category">${blog.category}</span>
                        </div>
                        <h3 class="blog-title">${blog.title}</h3>
                        <div class="blog-content">${shortDesc}</div>
                        <div class="blog-footer">
                            <span class="blog-author"><i class="fas fa-user"></i> ${blog.author}</span>
                            <span class="blog-meta-info"><i class="far fa-clock"></i> ${blog.readingTime || 1} min</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function trackView(id) {
            try {
                await fetch('/api/blogs/' + id + '/view', { method: 'POST' });
            } catch (e) { /* silently ignore */ }
        }

        // Reading progress bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('readingProgress').style.width = scrolled + '%';
        });

        // Load institute branding (logo + name)
        async function loadBranding() {
            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                if (settings.logo) {
                    const navLogo = document.querySelector('.nav-logo');
                    if (navLogo) { navLogo.src = settings.logo; }
                }
                if (settings.name) {
                    const link = document.querySelector('.nav-brand a');
                    if (link) link.textContent = settings.name;
                }
            } catch (e) {}
        }
        loadBranding();

        // Init
        loadPost();

        // Hamburger
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', () => {
                    hamburger.classList.toggle('active');
                    navMenu.classList.toggle('active');
                });
            }
        });
    </script>
</body>
</html>
