<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice Course - Genius Computer Education</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .app-header {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 600;
        }

        .app-logo i {
            color: #667eea;
            font-size: 24px;
        }

        .app-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }

        .view-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .view-btn:hover {
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.1);
        }

        .view-btn.active {
            background: #667eea;
            color: white;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-size: 14px;
            width: 200px;
            outline: none;
        }

        .search-box input::placeholder {
            color: #888;
        }

        .search-box i {
            color: #888;
        }

        /* Main Content */
        .app-main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .app-sidebar {
            width: 280px;
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h3 {
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 600;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .chapter-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #b0b0b0;
        }

        .chapter-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .chapter-item.active {
            background: rgba(102, 126, 234, 0.3);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        .chapter-number {
            width: 32px;
            height: 32px;
            background: rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .chapter-item.active .chapter-number {
            background: #667eea;
        }

        .chapter-info {
            flex: 1;
            min-width: 0;
        }

        .chapter-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chapter-lessons {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        /* Content Area */
        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-title h2 {
            color: #e0e0e0;
            font-size: 24px;
            font-weight: 600;
        }

        .content-title p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .progress-bar {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .content-body {
            flex: 1;
            overflow: hidden;
            padding: 20px 30px;
        }

        /* Grid View */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            height: 100%;
            overflow-y: auto;
        }

        .grid-view::-webkit-scrollbar {
            width: 6px;
        }

        .grid-view::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .grid-view::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .lesson-card {
            background: rgba(40, 40, 60, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lesson-card:hover {
            transform: translateY(-4px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
        }

        .lesson-card.completed {
            border-color: #22c55e;
        }

        .lesson-card.completed::before {
            content: '✓';
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .lesson-card {
            position: relative;
        }

        .lesson-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 20px;
            color: white;
        }

        .lesson-title {
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .lesson-description {
            color: #888;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .lesson-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }

        .lesson-duration {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* List View */
        .list-view {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            overflow-y: auto;
        }

        .list-view::-webkit-scrollbar {
            width: 6px;
        }

        .list-view::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .list-view::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .lesson-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(40, 40, 60, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lesson-row:hover {
            background: rgba(50, 50, 70, 0.9);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .lesson-row.completed {
            border-color: #22c55e;
        }

        .lesson-row-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        .lesson-row-info {
            flex: 1;
            min-width: 0;
        }

        .lesson-row-title {
            color: #e0e0e0;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .lesson-row-desc {
            color: #888;
            font-size: 13px;
        }

        .lesson-row-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #888;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* Carousel View */
        .carousel-view {
            display: flex;
            align-items: center;
            gap: 20px;
            height: 100%;
            position: relative;
        }

        .carousel-container {
            flex: 1;
            overflow-x: auto;
            display: flex;
            gap: 20px;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        .carousel-container::-webkit-scrollbar {
            height: 6px;
        }

        .carousel-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .carousel-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .carousel-card {
            min-width: 350px;
            max-width: 350px;
            background: rgba(40, 40, 60, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-card:hover {
            transform: scale(1.02);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .carousel-card.completed {
            border-color: #22c55e;
        }

        .carousel-card-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: white;
        }

        .carousel-card-title {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .carousel-card-desc {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .carousel-nav {
            width: 50px;
            height: 50px;
            background: rgba(102, 126, 234, 0.3);
            border: 1px solid rgba(102, 126, 234, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            color: white;
            font-size: 18px;
        }

        .carousel-nav:hover {
            background: #667eea;
            transform: scale(1.1);
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: rgba(102, 126, 234, 0.3);
            border: 1px solid rgba(102, 126, 234, 0.5);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: #667eea;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .app-sidebar {
                width: 240px;
            }

            .search-box input {
                width: 150px;
            }
        }

        @media (max-width: 768px) {
            .app-sidebar {
                display: none;
            }

            .app-controls {
                gap: 8px;
            }

            .search-box {
                display: none;
            }

            .view-toggle {
                padding: 2px;
            }

            .view-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .view-btn span {
                display: none;
            }

            .content-header {
                padding: 15px 20px;
            }

            .content-body {
                padding: 15px 20px;
            }

            .grid-view {
                grid-template-columns: 1fr;
            }

            .carousel-card {
                min-width: 280px;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="app-logo">
            <i class="fas fa-keyboard"></i>
            <span>Typing Practice Course</span>
        </div>
        <div class="app-controls">
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid" onclick="switchView('grid')">
                    <i class="fas fa-th-large"></i>
                    <span>Grid</span>
                </button>
                <button class="view-btn" data-view="list" onclick="switchView('list')">
                    <i class="fas fa-list"></i>
                    <span>List</span>
                </button>
                <button class="view-btn" data-view="carousel" onclick="switchView('carousel')">
                    <i class="fas fa-images"></i>
                    <span>Carousel</span>
                </button>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search lessons..." id="searchInput" oninput="filterLessons()">
            </div>
        </div>
    </div>

    <div class="app-main">
        <div class="app-sidebar">
            <div class="sidebar-header">
                <h3>Chapters</h3>
            </div>
            <div class="sidebar-content" id="chapterList">
                <!-- Chapters will be loaded here -->
            </div>
        </div>

        <div class="app-content">
            <div class="content-header">
                <div class="content-title">
                    <h2 id="currentChapterTitle">Chapter 1: Introduction</h2>
                    <p id="currentChapterDesc">Getting started with the course</p>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn" id="prevChapter" onclick="navigateChapter(-1)" disabled>
                        <i class="fas fa-chevron-left"></i> Previous
                    </button>
                    <button class="nav-btn" id="nextChapter" onclick="navigateChapter(1)">
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="content-body">
                <div class="progress-bar">
                    <div class="progress-fill" id="chapterProgress" style="width: 0%"></div>
                </div>
                <div style="margin-top: 20px;">
                    <div class="grid-view" id="lessonsContainer">
                        <!-- Lessons will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        // Typing Practice Course Data for Beginners
        const courseData = {

                {
                    id: 1,
                    title: "Basic Letters (A-Z)",
                    description: "Learn to type all letters of the alphabet",
                    lessons: [

                        { id: 2, title: "Top Row Keys", description: "Practice QWERTYUIOP top row", duration: "20 min", icon: "fa-keyboard", completed: false, text: extendText("qwertyuiop qwertyuiop qwertyuiop qwertyuiop", 12) },
                        { id: 3, title: "Bottom Row Keys", description: "Practice ZXCVBNM bottom row", duration: "20 min", icon: "fa-keyboard", completed: false, text: extendText("zxcvbnm zxcvbnm zxcvbnm zxcvbnm", 12) },

                        { id: 6, title: "4-Letter Words", description: "Common four letter words", duration: "20 min", icon: "fa-font", completed: false, text: extendText("good time work play book read love like home", 15) },

                {

                },
                {

                        { id: 26, title: "Names", description: "Practice typing names", duration: "20 min", icon: "fa-user", completed: false, text: extendText("John Mary Tom Lisa David Sarah Mike", 15) },
                        { id: 27, title: "Days of Week", description: "Practice days of the week", duration: "20 min", icon: "fa-calendar", completed: false, text: extendText("Monday Tuesday Wednesday Thursday Friday Saturday Sunday", 15) },
                        { id: 28, title: "Months of Year", description: "Practice months of the year", duration: "20 min", icon: "fa-calendar", completed: false, text: extendText("January February March April May June July August September October November December", 15) }
                    ]
                },
                {
                    id: 8,
                    title: "Punctuation",

        let currentChapterIndex = 0;
        let currentView = 'grid';
        let filteredLessons = [];

        // Initialize
        function init() {
            loadChapterList();
            loadChapter(0);
        }

        // Load chapter list in sidebar
        function loadChapterList() {
            const chapterList = document.getElementById('chapterList');
            chapterList.innerHTML = courseData.chapters.map((chapter, index) => `
                <div class="chapter-item ${index === currentChapterIndex ? 'active' : ''}" onclick="loadChapter(${index})">
                    <div class="chapter-number">${chapter.id}</div>
                    <div class="chapter-info">
                        <div class="chapter-title">${chapter.title}</div>
                        <div class="chapter-lessons">${chapter.lessons.length} lessons</div>
                    </div>
                </div>
            `).join('');
        }

        // Load specific chapter
        function loadChapter(index) {
            currentChapterIndex = index;
            const chapter = courseData.chapters[index];
            
            document.getElementById('currentChapterTitle').textContent = `Chapter ${chapter.id}: ${chapter.title}`;
            document.getElementById('currentChapterDesc').textContent = chapter.description;
            
            // Update navigation buttons
            document.getElementById('prevChapter').disabled = index === 0;
            document.getElementById('nextChapter').disabled = index === courseData.chapters.length - 1;
            
            // Update chapter list active state
            document.querySelectorAll('.chapter-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            // Calculate progress
            const completed = chapter.lessons.filter(l => l.completed).length;
            const progress = (completed / chapter.lessons.length) * 100;
            document.getElementById('chapterProgress').style.width = progress + '%';
            
            // Load lessons
            filteredLessons = chapter.lessons;
            renderLessons();
        }

        // Navigate between chapters
        function navigateChapter(direction) {
            const newIndex = currentChapterIndex + direction;
            if (newIndex >= 0 && newIndex < courseData.chapters.length) {
                loadChapter(newIndex);
            }
        }

        // Switch view mode
        function switchView(view) {
            currentView = view;
            
            // Update button states
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            
            renderLessons();
        }

        // Filter lessons based on search
        function filterLessons() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const chapter = courseData.chapters[currentChapterIndex];
            
            if (searchTerm) {
                filteredLessons = chapter.lessons.filter(lesson =>
                    lesson.title.toLowerCase().includes(searchTerm) ||
                    lesson.description.toLowerCase().includes(searchTerm)
                );
            } else {
                filteredLessons = chapter.lessons;
            }
            
            renderLessons();
        }

        // Render lessons based on current view
        function renderLessons() {
            const container = document.getElementById('lessonsContainer');
            container.className = currentView + '-view';
            
            if (currentView === 'carousel') {
                container.innerHTML = `
                    <div class="carousel-nav" onclick="scrollCarousel(-1)">
                        <i class="fas fa-chevron-left"></i>
                    </div>
                    <div class="carousel-container" id="carouselContainer">
                        ${filteredLessons.map(lesson => renderCarouselCard(lesson)).join('')}
                    </div>
                    <div class="carousel-nav" onclick="scrollCarousel(1)">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                `;
            } else {
                container.innerHTML = filteredLessons.map(lesson => {
                    if (currentView === 'grid') {
                        return renderGridCard(lesson);
                    } else {
                        return renderListRow(lesson);
                    }
                }).join('');
            }
        }

        // Render grid card
        function renderGridCard(lesson) {
            return `
                <div class="lesson-card ${lesson.completed ? 'completed' : ''}" onclick="openLesson(${lesson.id})">
                    <div class="lesson-icon">
                        <i class="fas ${lesson.icon}"></i>
                    </div>
                    <div class="lesson-title">${lesson.title}</div>
                    <div class="lesson-description">${lesson.description}</div>
                    <div class="lesson-meta">
                        <div class="lesson-duration">
                            <i class="fas fa-clock"></i>
                            ${lesson.duration}
                        </div>
                        <div class="lesson-status">
                            ${lesson.completed ? '<i class="fas fa-check-circle" style="color: #22c55e;"></i> Completed' : 'In Progress'}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render list row
        function renderListRow(lesson) {
            return `
                <div class="lesson-row ${lesson.completed ? 'completed' : ''}" onclick="openLesson(${lesson.id})">
                    <div class="lesson-row-icon">
                        <i class="fas ${lesson.icon}"></i>
                    </div>
                    <div class="lesson-row-info">
                        <div class="lesson-row-title">${lesson.title}</div>
                        <div class="lesson-row-desc">${lesson.description}</div>
                    </div>
                    <div class="lesson-row-meta">
                        <span><i class="fas fa-clock"></i> ${lesson.duration}</span>
                        <span>${lesson.completed ? '<i class="fas fa-check-circle" style="color: #22c55e;"></i> Completed' : 'In Progress'}</span>
                    </div>
                </div>
            `;
        }

        // Render carousel card
        function renderCarouselCard(lesson) {
            return `
                <div class="carousel-card ${lesson.completed ? 'completed' : ''}" onclick="openLesson(${lesson.id})">
                    <div class="carousel-card-icon">
                        <i class="fas ${lesson.icon}"></i>
                    </div>
                    <div class="carousel-card-title">${lesson.title}</div>
                    <div class="carousel-card-desc">${lesson.description}</div>
                    <div class="lesson-meta">
                        <div class="lesson-duration">
                            <i class="fas fa-clock"></i>
                            ${lesson.duration}
                        </div>
                        <div class="lesson-status">
                            ${lesson.completed ? '<i class="fas fa-check-circle" style="color: #22c55e;"></i> Completed' : 'In Progress'}
                        </div>
                    </div>
                </div>
            `;
        }

        // Scroll carousel
        function scrollCarousel(direction) {
            const container = document.getElementById('carouselContainer');
            const scrollAmount = 370;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        // Open lesson - redirect to typing practice page
        function openLesson(lessonId) {
            const chapter = courseData.chapters[currentChapterIndex];
            const lesson = chapter.lessons.find(l => l.id === lessonId);
            
            if (lesson && lesson.text) {
                // Store lesson data in localStorage
                localStorage.setItem('typingLesson', JSON.stringify({
                    title: lesson.title,
                    text: lesson.text,
                    chapter: chapter.title
                }));
                
                // Redirect to typing practice page
                window.location.href = 'typing-practice.html?selectLang=true';
            } else {
                alert('Lesson content not available.');
            }
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
