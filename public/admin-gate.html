<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gate - Genius Computer Education</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js?render=6LfDe_gsAAAAALle5tiQY_6WnVgp-wrRrhwlqk9t"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 50%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .gate-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .gate-icon {
            font-size: 60px;
            color: #fff;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .gate-title {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .gate-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .passcode-input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .passcode-input::placeholder {
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
        }

        .passcode-input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .attempts-warning {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 15px;
        }

        .loading {
            display: none;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 15px;
        }

        .loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="gate-container">
        <div class="gate-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="gate-title">Security Gate</h1>
        <p class="gate-subtitle">Enter the secret passcode to access admin panel</p>
        
        <input 
            type="password" 
            id="passcode" 
            class="passcode-input" 
            placeholder="••••" 
            maxlength="4"
            autocomplete="off"
        >
        
        <button class="submit-btn" id="submitBtn">
            <i class="fas fa-unlock"></i> Access Admin Panel
        </button>
        
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> Invalid passcode
        </div>
        
        <div class="attempts-warning" id="attemptsWarning">
            Attempts remaining: <span id="attemptsCount">5</span>
        </div>
        
        <div class="loading" id="loading">
            <i class="fas fa-spinner"></i> Verifying...
        </div>
    </div>

    <script>
        const passcodeInput = document.getElementById('passcode');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const attemptsWarning = document.getElementById('attemptsWarning');
        const attemptsCount = document.getElementById('attemptsCount');
        const loading = document.getElementById('loading');

        let attempts = 5;
        const STORAGE_KEY = 'adminGateAttempts';
        const LOCKOUT_KEY = 'adminGateLockout';

        // Check if locked out
        function checkLockout() {
            const lockout = localStorage.getItem(LOCKOUT_KEY);
            if (lockout) {
                const lockoutTime = parseInt(lockout);
                const now = Date.now();
                if (now < lockoutTime) {
                    const remaining = Math.ceil((lockoutTime - now) / 1000 / 60);
                    showError(`Too many failed attempts. Try again in ${remaining} minutes.`);
                    submitBtn.disabled = true;
                    passcodeInput.disabled = true;
                    return true;
                } else {
                    localStorage.removeItem(LOCKOUT_KEY);
                    localStorage.removeItem(STORAGE_KEY);
                    attempts = 5;
                    updateAttemptsDisplay();
                }
            }
            return false;
        }

        // Load attempts from storage
        function loadAttempts() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                attempts = parseInt(stored);
                updateAttemptsDisplay();
            }
        }

        // Update attempts display
        function updateAttemptsDisplay() {
            attemptsCount.textContent = attempts;
            if (attempts <= 2) {
                attemptsWarning.style.color = '#ef4444';
            } else {
                attemptsWarning.style.color = 'rgba(255, 255, 255, 0.7)';
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 3000);
        }

        // Handle passcode submission
        async function submitPasscode() {
            const passcode = passcodeInput.value.trim();
            
            if (!passcode) {
                showError('Please enter a passcode');
                return;
            }

            if (passcode.length !== 4) {
                showError('Passcode must be 4 digits');
                return;
            }

            loading.style.display = 'block';
            submitBtn.disabled = true;

            try {
                // Get reCAPTCHA token
                const recaptchaToken = await grecaptcha.execute('6LfDe_gsAAAAALle5tiQY_6WnVgp-wrRrhwlqk9t', {action: 'verify_gate_passcode'});

                const response = await fetch('/api/admin/verify-gate-passcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passcode, recaptchaToken })
                });

                const data = await response.json();

                loading.style.display = 'none';
                submitBtn.disabled = false;

                if (data.success) {
                    // Store gate access token
                    localStorage.setItem('adminGateAccess', Date.now().toString());
                    // Redirect to admin login
                    window.location.href = '/admin.html';
                } else {
                    attempts--;
                    localStorage.setItem(STORAGE_KEY, attempts.toString());
                    updateAttemptsDisplay();

                    if (attempts <= 0) {
                        // Lockout for 15 minutes
                        const lockoutTime = Date.now() + 15 * 60 * 1000;
                        localStorage.setItem(LOCKOUT_KEY, lockoutTime.toString());
                        showError('Too many failed attempts. Locked for 15 minutes.');
                        submitBtn.disabled = true;
                        passcodeInput.disabled = true;
                    } else {
                        showError('Invalid passcode');
                        passcodeInput.value = '';
                        passcodeInput.focus();
                    }
                }
            } catch (error) {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                showError('Error verifying passcode. Please try again.');
            }
        }

        // Event listeners
        submitBtn.addEventListener('click', submitPasscode);

        passcodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitPasscode();
            }
        });

        // Initialize
        if (!checkLockout()) {
            loadAttempts();
            passcodeInput.focus();
        }
    </script>
</body>
</html>
