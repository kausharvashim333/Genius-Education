<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses - Genius Computer Education</title>
    <link rel="stylesheet" href="css/style.css?v=20260719">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .courses-page-header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(118, 75, 162, 0.1));
            padding: 100px 20px 40px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .courses-page-header h1 {
            font-size: 2.2rem;
            color: #f8fafc;
            margin: 0 0 8px;
            font-weight: 700;
        }
        .courses-page-header p {
            color: #94a3b8;
            font-size: 1rem;
            margin: 0;
        }
        .courses-page-search {
            max-width: 500px;
            margin: 24px auto 0;
            position: relative;
        }
        .courses-page-search input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .courses-page-search input::placeholder {
            color: rgba(148, 163, 184, 0.6);
        }
        .courses-page-search input:focus {
            border-color: rgba(129, 140, 248, 0.5);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }
        .courses-page-search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #818cf8;
            font-size: 0.9rem;
        }
        .courses-page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .courses-page-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .courses-page-back:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .no-courses-found {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            padding: 60px 20px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23667eea%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22%3EG%3C/text%3E%3C/svg%3E" alt="Genius Computer Education Logo" class="nav-logo" id="navLogo" style="display: block; max-height: 45px; max-width: 45px; height: auto; width: auto; border-radius: 10px;">
                <a href="index.html">Genius Computer Education</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html" class="active">Courses</a></li>
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="index.html#blog">Blog</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li class="nav-tools-link"><a href="tools.html"><i class="fas fa-tools"></i> Tools</a></li>
                <li class="nav-portals-dropdown">
                    <a href="#" class="nav-cta nav-portals-toggle" onclick="togglePortalsDropdown(event)">
                        <i class="fas fa-th-large icon-3d"></i> Portals <i class="fas fa-chevron-down portals-chevron"></i>
                    </a>
                    <div class="portals-dropdown-menu" id="portalsDropdownMenu">
                        <a href="typing-practice.html?guide=true&selectLang=true&app=1" onclick="openTypingFullscreen(event); closePortalsDropdown();">
                            <i class="fas fa-keyboard"></i>
                            <span>Typing Practice</span>
                        </a>
                        <a href="student-portal.html" onclick="closePortalsDropdown()">
                            <i class="fas fa-user-graduate"></i>
                            <span>Student Portal</span>
                        </a>
                        <a href="faculty-portal.html" onclick="closePortalsDropdown()">
                            <i class="fas fa-chalkboard-teacher"></i>
                            <span>Faculty Portal</span>
                        </a>
                    </div>
                </li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Courses Page Header -->
    <div class="courses-page-header">
        <a href="index.html" class="courses-page-back"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <h1>All Courses</h1>
        <p>Explore our complete range of computer courses</p>
        <div class="courses-page-search">
            <i class="fas fa-search"></i>
            <input type="text" id="courseSearchInput" placeholder="Search courses...">
        </div>
    </div>

    <!-- Courses Grid -->
    <div class="courses-page-grid" id="allCoursesContainer"></div>

    <!-- Course Detail Modal -->
    <div id="courseDetailModal" class="modal">
        <div class="modal-content" style="max-width: 700px; max-height: 90vh; overflow-y: auto;">
            <button class="modal-close-btn" onclick="closeCourseModal()">&times;</button>
            <div id="courseModalContent"></div>
        </div>
    </div>

    <script src="js/main.js?v=20260719"></script>
    <script>
        // Load all courses
        async function loadAllCourses() {
            try {
                const res = await fetch('/api/courses');
                const courses = await res.json();
                window._coursesData = courses;
                renderCourses(courses);
            } catch (err) {
                console.error('Error loading courses:', err);
                document.getElementById('allCoursesContainer').innerHTML = '<p class="no-courses-found">Unable to load courses.</p>';
            }
        }

        function renderCourses(courses) {
            const container = document.getElementById('allCoursesContainer');
            if (courses.length === 0) {
                container.innerHTML = '<p class="no-courses-found">No courses found.</p>';
                return;
            }

            // Get site logo
            fetch('/api/settings').then(r => r.json()).catch(() => ({})).then(settings => {
                const siteLogo = settings.logo || '';
                const logoImg = siteLogo ? `<img src="${siteLogo}" alt="Logo" style="width:14px;height:14px;object-fit:contain;margin-right:4px;border-radius:3px;">` : '<i class="fas fa-graduation-cap"></i>';

                container.innerHTML = courses.map(course => {
                    const emoji = getCourseEmoji(course.name);
                    const fee = course.fee || course.price || 0;
                    const feeType = course.feeType || 'Per Program';
                    const priceFormatted = parseInt(fee).toLocaleString('en-IN');
                    const eligibility = course.eligibility || '';
                    const shortDesc = course.description.substring(0, 100) + (course.description.length > 100 ? '...' : '');
                    return `
                    <div class="course-card">
                        <div class="course-card-header">
                            <span class="course-emoji">${emoji}</span>
                            <h3>${course.name}</h3>
                        </div>
                        <div class="course-card-body">
                            <div class="course-meta">
                                <span class="meta-tag"><i class="fas fa-clock"></i> ${course.duration}</span>
                                ${eligibility ? `<span class="meta-tag">${logoImg} ${eligibility}</span>` : ''}
                            </div>
                            <p class="course-preview">${shortDesc}</p>
                            <div class="course-card-actions">
                                <button class="btn-view" onclick="openCourseModal(${course.id})"><i class="fas fa-eye"></i> View Details</button>
                                <a href="apply.html?course=${encodeURIComponent(course.name)}" class="btn-enroll"><i class="fas fa-user-graduate"></i> Enroll Now</a>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            });
        }

        // Search functionality
        document.getElementById('courseSearchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const filtered = (window._coursesData || []).filter(c =>
                c.name.toLowerCase().includes(query) ||
                (c.description || '').toLowerCase().includes(query)
            );
            renderCourses(filtered);
        });

        // Load site settings for nav logo
        fetch('/api/settings').then(r => r.json()).catch(() => ({})).then(settings => {
            if (settings.logo) {
                const navLogo = document.getElementById('navLogo');
                navLogo.src = settings.logo;
                navLogo.style.display = '';
            }
        });

        // Portals Dropdown
        function togglePortalsDropdown(e) {
            e.preventDefault();
            e.stopPropagation();
            const menu = document.getElementById('portalsDropdownMenu');
            const toggle = e.currentTarget;
            menu.classList.toggle('open');
            toggle.classList.toggle('active');
        }

        function closePortalsDropdown() {
            const menu = document.getElementById('portalsDropdownMenu');
            const toggle = document.querySelector('.nav-portals-toggle');
            if (menu) menu.classList.remove('open');
            if (toggle) toggle.classList.remove('active');
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.querySelector('.nav-portals-dropdown');
            if (dropdown && !dropdown.contains(e.target)) {
                closePortalsDropdown();
            }
        });

        // Open typing practice as a separate app window
        function openTypingFullscreen(event) {
            event.preventDefault();
            const anchor = event.target.closest('a');
            const url = anchor ? anchor.getAttribute('href') : null;
            if (!url) return;
            const w = window.screen.availWidth;
            const h = window.screen.availHeight;
            const features = 'popup=yes,width=' + w + ',height=' + h + ',left=0,top=0,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes';
            let win = null;
            try { win = window.open(url, 'geniusTypingPractice', features); } catch (e) { win = null; }
            if (win) {
                win.focus();
                try {
                    const popupEl = win.document.documentElement;
                    const req = popupEl.requestFullscreen || popupEl.webkitRequestFullscreen;
                    if (req) Promise.resolve(req.call(popupEl)).catch(() => {});
                } catch (e) {}
            } else { window.location.href = url; }
        }

        // Show entrance exam link only when feature is enabled
        (async function () {
            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                if (settings && settings.entranceExamEnabled) {
                    const link = document.getElementById('navEntranceExamLink');
                    if (link) link.style.display = '';
                }
            } catch (e) {}
        })();

        // Hamburger menu toggle
        const hamburgerBtn = document.querySelector('.hamburger');
        const navMenuEl = document.querySelector('.nav-menu');
        if (hamburgerBtn && navMenuEl) {
            hamburgerBtn.addEventListener('click', () => navMenuEl.classList.toggle('active'));
        }

        loadAllCourses();
    </script>
    <script src="/js/security.js"></script>
</body>
</html>
